<text x="180" y="276" text-anchor="middle" font-size="13" font-weight="400" fill="#6B6B6B" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">Nobody draws from the dead wall in normal turns;</text>
